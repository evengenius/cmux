[package]
name = "cmux"
version = "0.1.0"
edition = "2021"
description = "A Midnight-Commander-style TUI host for the Claude Code CLI: tabs, sessions sidebar, deep-grep, file browser, bottom shell pane, activity overlay."
authors = ["Evgeniy <vmatrixru@gmail.com>"]
license = "MIT"
repository = "https://github.com/evengenius/cmux"
readme = "README.md"
keywords = ["claude", "claude-code", "tui", "terminal", "wrapper"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
ratatui = "0.29"
crossterm = "0.28"
portable-pty = "0.8"
tui-term = "0.2"
vt100 = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
